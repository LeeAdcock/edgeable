[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeable"
version = "0.2.0"
description = "Easy to use, in memory, persistable graph database."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Lee Adcock", email = "lee@katieandlee.com" }]
keywords = ["graph", "database", "in-memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "coverage", "black~=26.0", "build", "twine"]

[project.urls]
Homepage = "https://github.com/LeeAdcock/edgeable"
Issues = "https://github.com/LeeAdcock/edgeable/issues"
Changelog = "https://github.com/LeeAdcock/edgeable/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["edgeable"]

[tool.black]
target-version = ["py310"]
